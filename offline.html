<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff7f11" />
    <title>Offline — trySearch</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #11100e; background: #fffffc; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.25rem; background: radial-gradient(circle at top left, rgba(255,127,17,.2), transparent 35%), #fffffc; }
      main { width: min(100%, 32rem); padding: clamp(1.6rem, 7vw, 3rem); border: 1px solid rgba(190,183,164,.8); border-radius: 1.5rem; background: rgba(255,255,252,.9); box-shadow: 0 22px 55px rgba(0,0,0,.1); }
      .mark { display: block; width: 3.35rem; height: 3.35rem; object-fit: contain; }
      h1 { margin: 1.25rem 0 .5rem; font-size: clamp(2rem, 8vw, 3rem); letter-spacing: -.06em; line-height: 1; }
      p { color: rgba(0,0,0,.68); line-height: 1.6; } a { display: inline-block; margin-top: .75rem; color: #11100e; font-weight: 700; }
    </style>
  </head>
  <body><main><img class="mark" src="/trysearch-logo.png" alt="trySearch" /><h1>You’re offline.</h1><p>Reconnect to continue using live analytics and saved workspace data. Previously visited pages may still be available.</p><a href="/">Try again</a></main></body>
</html>
